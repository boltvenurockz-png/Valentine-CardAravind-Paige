<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family: Arial, sans-serif;
}

.card{
  background:white;
  width:320px;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.hidden{
  display:none;
}

h1{
  color:#ff4d6d;
}

button{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.buttons{
  display:flex;
  justify-content:space-around;
}

#noBtn{
  background:#ccc;
  color:#333;
  position:relative;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="card" id="page1">
  <h1>I love you so much ❤️</h1>
  <p>More than words can ever say.</p>
  <div style="font-size:40px;">🧸🧸🧸</div>
  <button onclick="nextPage()">Next 💕</button>
</div>

<!-- PAGE 2 -->
<div class="card hidden" id="page2">
  <h1>Will you be my Valentine? 💖</h1>
  <div class="buttons">
    <button onclick="yes()">Yes 💘</button>
    <button id="noBtn" onmouseover="moveNo()">No 🙈</button>
  </div>
</div>

<script>
function nextPage(){
  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");
}

function yes(){
  alert("YAY!!! You are my Valentine ❤️🧸");
}

function moveNo(){
  const btn = document.getElementById("noBtn");
  btn.style.top = Math.random()*100 + "px";
  btn.style.left = Math.random()*100 + "px";
}
</script>

</body>
</html>
